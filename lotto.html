<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#030712">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>로또 번호 생성기</title>

  <style>
    :root {
      --bg: #030712;
      --card: #111827;
      --border: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #3b82f6;
      --accent2: #a855f7;
      /* 동행복권 공식 공 색상 구간: 1-10 노랑, 11-20 파랑, 21-30 빨강, 31-40 회색, 41-45 초록 */
      --b1: #fbc400;
      --b2: #69c8f2;
      --b3: #ff7272;
      --b4: #aaaaaa;
      --b5: #b0d840;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    body {
      min-height: 100dvh;
      padding: calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    }

    .wrap { max-width: 480px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    header a { color: var(--muted); text-decoration: none; font-size: 14px; padding: 8px 0; }

    h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #3b82f6 0%, #a855f7 50%, #10b981 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 16px; }
    .tabs a {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border: 1px solid var(--border);
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    .tabs a.on { background: #1f2937; color: var(--text); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .label { font-size: 13px; color: var(--muted); margin-bottom: 10px; }

    /* 게임 수 선택 */
    .seg { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .seg button {
      height: 44px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
    }
    .seg button.on { background: var(--accent); border-color: var(--accent); }

    /* 번호 패드 */
    .mode { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
    .mode button {
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }
    .mode button.on.fix { background: #065f46; border-color: #10b981; color: #fff; }
    .mode button.on.ex { background: #7f1d1d; border-color: #ef4444; color: #fff; }

    .pad { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .pad button {
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }
    .pad button.fix { background: #10b981; border-color: #10b981; color: #fff; }
    .pad button.ex { background: #374151; border-color: #374151; color: #6b7280; text-decoration: line-through; }

    .seg.c2 { grid-template-columns: repeat(2, 1fr); }
    .seg.c3 { grid-template-columns: repeat(3, 1fr); }
    .seg.c2 button, .seg.c3 button { font-size: 14px; }
    .seg button:disabled { opacity: 0.35; }
    .sub { margin-top: 14px; }

    .chk { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 12px; color: var(--text); }
    .chk input { width: 18px; height: 18px; accent-color: var(--accent); }

    /* 통계 */
    .latest { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; }
    .latest .meta { width: 100%; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .latest .ball, .mini-balls .ball { width: 30px; height: 30px; font-size: 12px; animation: none; }
    .latest .plus { color: var(--muted); font-size: 14px; margin: 0 2px; }

    .chart { display: flex; align-items: flex-end; gap: 2px; height: 120px; border-bottom: 1px solid #374151; }
    .bar {
      flex: 1;
      min-height: 2px;
      background: #3b82f6;
      border-radius: 2px 2px 0 0;
      cursor: pointer;
    }
    .bar.on { background: #93c5fd; }
    .axis { display: flex; justify-content: space-between; font-size: 10px; color: #6b7280; margin-top: 4px; }
    .readout { font-size: 13px; margin-top: 8px; min-height: 18px; }
    .readout b { color: #93c5fd; }

    .hotcold { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 14px; }
    .hotcold .label { margin-bottom: 6px; }
    .mini-balls { display: flex; gap: 4px; }

    .hint { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
    .hint b { color: var(--text); font-weight: 600; }

    .row-btns { display: flex; gap: 8px; margin-top: 10px; }
    .ghost {
      flex: 1;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 13px;
    }

    /* 생성 버튼 */
    .go {
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3);
    }
    .go:active { transform: scale(0.98); }
    .go:disabled { opacity: 0.6; }

    /* 결과 */
    .game {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .game:last-child { border-bottom: none; }
    .game .tag { width: 18px; font-size: 13px; font-weight: 700; color: var(--muted); }
    .balls { display: flex; gap: 6px; flex: 1; justify-content: space-between; }

    .ball {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      box-shadow: inset -3px -3px 6px rgba(0, 0, 0, 0.2), inset 3px 3px 6px rgba(255, 255, 255, 0.3);
      animation: pop 0.35s ease-out both;
    }
    .ball.c1 { background: var(--b1); }
    .ball.c2 { background: var(--b2); }
    .ball.c3 { background: var(--b3); }
    .ball.c4 { background: var(--b4); }
    .ball.c5 { background: var(--b5); }

    @keyframes pop {
      0% { transform: scale(0) rotate(-180deg); opacity: 0; }
      80% { transform: scale(1.1) rotate(10deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); }
    }

    .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 20px 0; }

    .history-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
    .history-item:last-child { border-bottom: none; }
    .history-item time { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .history-item .mini { display: flex; gap: 4px; margin-bottom: 4px; }
    .history-item .ball { width: 26px; height: 26px; font-size: 11px; animation: none; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(100px);
      background: #1f2937;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      transition: transform 0.25s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    footer { font-size: 11px; color: #6b7280; text-align: center; line-height: 1.6; margin-top: 8px; }

    @media (max-width: 360px) {
      .ball { width: 34px; height: 34px; font-size: 14px; }
      .balls { gap: 4px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ball { animation: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>로또 6/45 생성기</h1>
      <a href="index.html">← 홈</a>
    </header>

    <nav class="tabs">
      <a href="lotto.html" class="on">로또 6/45</a>
      <a href="pension.html">연금복권720+</a>
    </nav>

    <!-- 생성 방식 -->
    <section class="card">
      <div class="label">생성 방식</div>
      <div class="seg c2" id="genSeg">
        <button data-g="random" class="on">완전 랜덤</button>
        <button data-g="stats" disabled>통계 반영</button>
      </div>
      <div id="statsOpts" hidden>
        <div class="label sub">분석 기간</div>
        <div class="seg c3" id="rangeSeg">
          <button data-r="0" class="on">전체</button>
          <button data-r="100">최근 100회</button>
          <button data-r="30">최근 30회</button>
        </div>
        <div class="label sub">가중치</div>
        <div class="seg c2" id="biasSeg">
          <button data-b="hot" class="on">많이 나온 번호</button>
          <button data-b="cold">적게 나온 번호</button>
        </div>
        <label class="chk"><input type="checkbox" id="fShape" checked> 홀짝 2~4개 · 합계를 과거 분포(10~90%) 안으로</label>
        <label class="chk"><input type="checkbox" id="fPast" checked> 역대 1등 조합 제외</label>
      </div>
      <div class="hint" id="dataHint">당첨 데이터 불러오는 중…</div>
    </section>

    <!-- 게임 수 -->
    <section class="card">
      <div class="label">게임 수</div>
      <div class="seg" id="countSeg">
        <button data-n="1">1</button>
        <button data-n="2">2</button>
        <button data-n="3">3</button>
        <button data-n="4">4</button>
        <button data-n="5" class="on">5</button>
      </div>
    </section>

    <button class="go" id="goBtn">번호 생성</button>

    <!-- 결과 -->
    <section class="card">
      <div class="label" style="display:flex;justify-content:space-between;align-items:center;">
        <span>생성 결과</span>
        <button class="ghost" id="copyBtn" style="flex:0 0 auto;height:30px;padding:0 12px;">복사</button>
      </div>
      <div id="result"><div class="empty">버튼을 눌러 번호를 생성하세요</div></div>
    </section>

    <!-- 통계 -->
    <section class="card" id="statsCard" hidden>
      <div class="label label-row" style="display:flex;justify-content:space-between;">
        <span>당첨번호 통계</span>
        <span id="rangeLabel"></span>
      </div>
      <div class="latest" id="latest"></div>
      <div class="label">번호별 출현 횟수 (보너스 제외)</div>
      <div class="chart" id="chart" role="img" aria-label="1~45번 출현 횟수 막대 차트"></div>
      <div class="axis"><span>1</span><span>10</span><span>20</span><span>30</span><span>40</span><span>45</span></div>
      <div class="readout" id="readout">막대를 누르면 횟수가 보여요</div>
      <div class="hotcold">
        <div><div class="label">많이 나온 번호</div><div class="mini-balls" id="hot"></div></div>
        <div><div class="label">적게 나온 번호</div><div class="mini-balls" id="cold"></div></div>
      </div>
    </section>

    <!-- 고정/제외 -->
    <section class="card">
      <div class="label">번호 고정 / 제외 (선택)</div>
      <div class="mode">
        <button id="modeFix" class="on fix">고정수 선택</button>
        <button id="modeEx" class="ex">제외수 선택</button>
      </div>
      <div class="pad" id="pad"></div>
      <div class="hint" id="padHint"></div>
      <div class="row-btns">
        <button class="ghost" id="clearPad">선택 초기화</button>
      </div>
    </section>

    <!-- 기록 -->
    <section class="card">
      <div class="label" style="display:flex;justify-content:space-between;align-items:center;">
        <span>최근 기록 (최대 10회)</span>
        <button class="ghost" id="clearHist" style="flex:0 0 auto;height:30px;padding:0 12px;">지우기</button>
      </div>
      <div id="history"></div>
    </section>

    <footer>
      번호는 브라우저의 crypto.getRandomValues로 무작위 생성되며<br>
      당첨 확률을 높여주지 않습니다. 재미로만 이용하세요.
    </footer>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function () {
      const MAX = 45;
      const PICK = 6;
      const HIST_KEY = 'lotto-history-v1';

      let count = 5;
      let mode = 'fix';
      const fixed = new Set();
      const excluded = new Set();

      const $ = (id) => document.getElementById(id);

      // 0 이상 max 미만의 균등 난수 (modulo bias 제거를 위한 rejection sampling)
      function randInt(max) {
        const buf = new Uint32Array(1);
        const limit = Math.floor(0x100000000 / max) * max;
        let x;
        do {
          crypto.getRandomValues(buf);
          x = buf[0];
        } while (x >= limit);
        return x % max;
      }

      // ---- 당첨 데이터 / 통계 ----
      let draws = [];          // [{round, date, numbers:[6], bonus}]
      let pastCombos = new Set();
      let genMode = 'random';  // 'random' | 'stats'
      let range = 0;           // 0 = 전체, N = 최근 N회
      let bias = 'hot';        // 'hot' | 'cold'
      let relaxed = false;

      function randFloat() {
        const buf = new Uint32Array(1);
        crypto.getRandomValues(buf);
        return buf[0] / 0x100000000;
      }

      function windowDraws() {
        return range ? draws.slice(-range) : draws;
      }

      function frequency(list) {
        const freq = new Array(MAX + 1).fill(0);
        list.forEach((d) => d.numbers.forEach((n) => freq[n]++));
        return freq;
      }

      function percentile(sorted, p) {
        return sorted[Math.min(sorted.length - 1, Math.floor(p * sorted.length))];
      }

      function uniformGame() {
        const picked = new Set(fixed);
        const pool = [];
        for (let n = 1; n <= MAX; n++) {
          if (!picked.has(n) && !excluded.has(n)) pool.push(n);
        }
        // 부분 Fisher-Yates 셔플
        const need = PICK - picked.size;
        for (let i = 0; i < need; i++) {
          const j = i + randInt(pool.length - i);
          [pool[i], pool[j]] = [pool[j], pool[i]];
          picked.add(pool[i]);
        }
        return [...picked].sort((a, b) => a - b);
      }

      // 출현 빈도로 가중치를 준 비복원 추출
      function weightedGame(weights) {
        const picked = new Set(fixed);
        const pool = [];
        for (let n = 1; n <= MAX; n++) {
          if (!picked.has(n) && !excluded.has(n)) pool.push(n);
        }
        while (picked.size < PICK) {
          const total = pool.reduce((s, n) => s + weights[n], 0);
          let r = randFloat() * total;
          let idx = 0;
          while (idx < pool.length - 1 && (r -= weights[pool[idx]]) >= 0) idx++;
          picked.add(pool[idx]);
          pool.splice(idx, 1);
        }
        return [...picked].sort((a, b) => a - b);
      }

      function statsGame() {
        const list = windowDraws();
        const freq = frequency(list);
        const maxF = Math.max(...freq.slice(1));
        const weights = freq.map((c) => (bias === 'hot' ? c + 1 : maxF - c + 1));

        const useShape = $('fShape').checked;
        const usePast = $('fPast').checked;
        const sums = list.map((d) => d.numbers.reduce((a, b) => a + b, 0)).sort((a, b) => a - b);
        const lo = percentile(sums, 0.1);
        const hi = percentile(sums, 0.9);

        let game;
        for (let tries = 0; tries < 5000; tries++) {
          game = weightedGame(weights);
          if (useShape) {
            const odd = game.filter((n) => n % 2).length;
            const sum = game.reduce((a, b) => a + b, 0);
            if (odd < 2 || odd > 4 || sum < lo || sum > hi) continue;
          }
          if (usePast && pastCombos.has(game.join(','))) continue;
          return game;
        }
        relaxed = true; // 고정/제외 조건 때문에 필터를 못 맞춘 경우
        return game;
      }

      function generateGame() {
        return genMode === 'stats' && draws.length ? statsGame() : uniformGame();
      }

      function colorClass(n) {
        if (n <= 10) return 'c1';
        if (n <= 20) return 'c2';
        if (n <= 30) return 'c3';
        if (n <= 40) return 'c4';
        return 'c5';
      }

      function ballHTML(n, delay) {
        const style = delay != null ? ` style="animation-delay:${delay}ms"` : '';
        return `<div class="ball ${colorClass(n)}"${style}>${n}</div>`;
      }

      // ---- 게임 수 ----
      $('countSeg').addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        count = Number(btn.dataset.n);
        [...$('countSeg').children].forEach((b) => b.classList.toggle('on', b === btn));
      });

      // ---- 고정/제외 패드 ----
      const pad = $('pad');
      for (let n = 1; n <= MAX; n++) {
        const b = document.createElement('button');
        b.textContent = n;
        b.dataset.n = n;
        pad.appendChild(b);
      }

      function setMode(m) {
        mode = m;
        $('modeFix').classList.toggle('on', m === 'fix');
        $('modeEx').classList.toggle('on', m === 'ex');
      }
      $('modeFix').addEventListener('click', () => setMode('fix'));
      $('modeEx').addEventListener('click', () => setMode('ex'));

      function renderPad() {
        [...pad.children].forEach((b) => {
          const n = Number(b.dataset.n);
          b.classList.toggle('fix', fixed.has(n));
          b.classList.toggle('ex', excluded.has(n));
        });
        $('padHint').innerHTML =
          `고정 <b>${fixed.size}</b>/5개 · 제외 <b>${excluded.size}</b>개 ` +
          `(남은 후보 ${MAX - excluded.size}개, 최소 ${PICK}개 필요)`;
      }

      pad.addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        const n = Number(b.dataset.n);

        if (mode === 'fix') {
          if (fixed.has(n)) {
            fixed.delete(n);
          } else {
            if (fixed.size >= PICK - 1) return toast('고정수는 최대 5개까지 가능해요');
            excluded.delete(n);
            fixed.add(n);
          }
        } else {
          if (excluded.has(n)) {
            excluded.delete(n);
          } else {
            if (MAX - excluded.size - 1 < PICK) return toast('후보가 6개 미만이 될 수 없어요');
            fixed.delete(n);
            excluded.add(n);
          }
        }
        renderPad();
      });

      $('clearPad').addEventListener('click', () => {
        fixed.clear();
        excluded.clear();
        renderPad();
      });

      // ---- 생성 ----
      let lastGames = [];

      $('goBtn').addEventListener('click', () => {
        relaxed = false;
        lastGames = Array.from({ length: count }, generateGame);
        if (relaxed) toast('조건을 모두 만족하는 조합이 없어 일부 필터를 건너뛰었어요');

        const labels = 'ABCDE';
        $('result').innerHTML = lastGames
          .map((g, gi) =>
            `<div class="game"><span class="tag">${labels[gi]}</span><div class="balls">` +
            g.map((n, i) => ballHTML(n, gi * 120 + i * 60)).join('') +
            `</div></div>`)
          .join('');

        if (navigator.vibrate) navigator.vibrate(30);
        saveHistory(lastGames);
        renderHistory();
      });

      // ---- 복사 ----
      $('copyBtn').addEventListener('click', async () => {
        if (!lastGames.length) return toast('먼저 번호를 생성하세요');
        const text = lastGames.map((g, i) => `${'ABCDE'[i]}: ${g.join(', ')}`).join('\n');
        try {
          await navigator.clipboard.writeText(text);
          toast('복사되었습니다');
        } catch (_) {
          toast('복사에 실패했어요');
        }
      });

      // ---- 기록 (localStorage, 실패해도 동작) ----
      function loadHistory() {
        try {
          return JSON.parse(localStorage.getItem(HIST_KEY)) || [];
        } catch (_) {
          return [];
        }
      }

      function saveHistory(games) {
        const hist = loadHistory();
        hist.unshift({ t: Date.now(), games });
        try {
          localStorage.setItem(HIST_KEY, JSON.stringify(hist.slice(0, 10)));
        } catch (_) { /* 저장 불가 환경 무시 */ }
      }

      function renderHistory() {
        const hist = loadHistory();
        if (!hist.length) {
          $('history').innerHTML = '<div class="empty">기록이 없습니다</div>';
          return;
        }
        $('history').innerHTML = hist
          .map((h) =>
            `<div class="history-item"><time>${new Date(h.t).toLocaleString('ko-KR')}</time>` +
            h.games.map((g) => `<div class="mini">${g.map((n) => ballHTML(n)).join('')}</div>`).join('') +
            `</div>`)
          .join('');
      }

      $('clearHist').addEventListener('click', () => {
        try { localStorage.removeItem(HIST_KEY); } catch (_) {}
        renderHistory();
      });

      // ---- 생성 방식 UI ----
      function bindSeg(id, key, onPick) {
        $(id).addEventListener('click', (e) => {
          const btn = e.target.closest('button');
          if (!btn || btn.disabled) return;
          [...$(id).children].forEach((b) => b.classList.toggle('on', b === btn));
          onPick(btn.dataset[key]);
        });
      }

      bindSeg('genSeg', 'g', (v) => {
        genMode = v;
        $('statsOpts').hidden = v !== 'stats';
      });
      bindSeg('rangeSeg', 'r', (v) => {
        range = Number(v);
        renderStats();
      });
      bindSeg('biasSeg', 'b', (v) => (bias = v));

      function renderStats() {
        const list = windowDraws();
        const freq = frequency(list);
        const maxF = Math.max(1, ...freq.slice(1));
        const expected = (list.length * PICK) / MAX;

        $('rangeLabel').textContent = `${list[0].round}~${list[list.length - 1].round}회 (${list.length}회)`;

        const last = draws[draws.length - 1];
        $('latest').innerHTML =
          `<div class="meta">최근 제${last.round}회 (${last.date})</div>` +
          last.numbers.map((n) => ballHTML(n)).join('') +
          `<span class="plus">+</span>${ballHTML(last.bonus)}`;

        const chart = $('chart');
        chart.innerHTML = '';
        for (let n = 1; n <= MAX; n++) {
          const bar = document.createElement('div');
          bar.className = 'bar';
          bar.style.height = `${(freq[n] / maxF) * 100}%`;
          bar.title = `${n}번: ${freq[n]}회`;
          const show = () => {
            [...chart.children].forEach((b) => b.classList.toggle('on', b === bar));
            $('readout').innerHTML =
              `<b>${n}번</b> ${freq[n]}회 출현 · 기대값 ${expected.toFixed(1)}회 대비 ` +
              `${freq[n] >= expected ? '+' : ''}${(freq[n] - expected).toFixed(1)}`;
          };
          bar.addEventListener('pointerenter', show);
          bar.addEventListener('click', show);
          chart.appendChild(bar);
        }

        const ranked = Array.from({ length: MAX }, (_, i) => i + 1).sort((a, b) => freq[b] - freq[a] || a - b);
        $('hot').innerHTML = ranked.slice(0, 6).map((n) => ballHTML(n)).join('');
        $('cold').innerHTML = ranked.slice(-6).reverse().map((n) => ballHTML(n)).join('');
      }

      fetch('data/lotto.json', { cache: 'no-cache' })
        .then((r) => (r.ok ? r.json() : Promise.reject(new Error(r.status))))
        .then((data) => {
          draws = (data.draws || []).slice().sort((a, b) => a.round - b.round);
          if (!draws.length) throw new Error('empty');
          pastCombos = new Set(draws.map((d) => d.numbers.slice().sort((a, b) => a - b).join(',')));
          const last = draws[draws.length - 1];
          $('dataHint').textContent = `제1~${last.round}회 당첨번호 ${draws.length}건 기준 (${last.date} 추첨까지)`;
          $('genSeg').querySelector('[data-g="stats"]').disabled = false;
          $('statsCard').hidden = false;
          renderStats();
        })
        .catch(() => {
          $('dataHint').textContent = '당첨 데이터를 불러오지 못해 완전 랜덤만 사용할 수 있어요';
        });

      // ---- 토스트 ----
      let toastTimer;
      function toast(msg) {
        const el = $('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
      }

      renderPad();
      renderHistory();
    })();
  </script>
</body>
</html>
