name: Probe dhlottery endpoints

on:
  push:
    paths:
      - .github/workflows/probe-dhlottery.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Mobile Safari/537.36"
          echo "##### old lotto json"
          curl -sS -m 20 -A "$UA" "https://www.dhlottery.co.kr/common.do?method=getLottoNumber&drwNo=1100" | head -c 400; echo
          echo "##### old pension page"
          curl -sS -m 20 -A "$UA" -o /tmp/o -w "status=%{http_code} final=%{url_effective}\n" -L "https://www.dhlottery.co.kr/gameResult.do?method=win720&Round=200"
          echo "##### lotto JS context"
          curl -sS -m 20 -A "$UA" https://www.dhlottery.co.kr/lt645/result > /tmp/l
          grep -n -B40 -A25 "selectPstLt645InfoNew.do" /tmp/l | cut -c1-220
          echo "##### pension JS context"
          curl -sS -m 20 -A "$UA" https://www.dhlottery.co.kr/pt720/result > /tmp/p
          grep -n -B30 -A30 -E "selectPstPt720WnList.do|selectPstPt720WnInfo.do" /tmp/p | cut -c1-220
          grep -n -A40 "sendHttpJson *[:=(]\|sendHttpJson: *function\|function sendHttpJson" /tmp/p | head -60 | cut -c1-220
