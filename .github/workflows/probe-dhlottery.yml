name: Probe dhlottery endpoints

on:
  push:
    paths:
      - .github/workflows/probe-dhlottery.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Mobile Safari/537.36"
          B=https://www.dhlottery.co.kr
          get() {
            echo "##### $1"
            curl -sS -m 30 -A "$UA" -H "X-Requested-With: XMLHttpRequest" -H "Accept: application/json, text/javascript, */*" \
              -H "Referer: $B/$2" -o /tmp/r -w "status=%{http_code} type=%{content_type} size=%{size_download}\n" "$B$1"
            head -c 1800 /tmp/r; echo
            python3 - <<'PY' || true
          import json
          d = json.load(open('/tmp/r'))
          def walk(o, p=''):
              if isinstance(o, dict):
                  for k, v in o.items(): walk(v, p + '.' + k)
              elif isinstance(o, list):
                  print(p, 'list len', len(o))
                  if o: print(p, 'first', json.dumps(o[0], ensure_ascii=False)[:900]); print(p, 'last', json.dumps(o[-1], ensure_ascii=False)[:300])
          walk(d)
          PY
          }
          get "/lt645/selectPstLt645InfoNew.do?srchDir=center&srchLtEpsd=1100" lt645/result
          get "/lt645/selectPstLt645InfoNew.do?srchDir=latest" lt645/result
          get "/lt645/selectPstLt645InfoNew.do?srchDir=older&srchCursorLtEpsd=100" lt645/result
          get "/pt720/selectPstPt720WnList.do" pt720/result
          get "/pt720/selectPstPt720Info.do?srchPsltEpsd=200" pt720/result
