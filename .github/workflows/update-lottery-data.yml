name: Update lottery data

on:
  schedule:
    # UTC 기준. 연금복권 목 19:05 KST 추첨 → 목 20:23 KST,
    # 로또 토 20:35 KST 추첨 → 토 22:23 KST, 누락 대비 일 09:23 KST
    - cron: '23 11 * * 4'
    - cron: '23 13 * * 6'
    - cron: '23 0 * * 0'
  push:
    paths:
      - scripts/update-lottery-data.mjs
      - .github/workflows/update-lottery-data.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lottery-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch draws
        run: node scripts/update-lottery-data.mjs

      - name: Commit changes
        if: always()
        run: |
          git add -N data
          if git diff --quiet -- data; then
            echo "no data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore(data): update lottery draws"
          git push origin HEAD:${{ github.ref_name }}
